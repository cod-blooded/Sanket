<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">SANKET animated logo</title>
  <desc id="desc">Proper vector animated SVG logo for Sanket. The hand, message bubble, dots, text and tagline animate separately once on load.</desc>
  <defs>
    <linearGradient id="handGrad" x1="368" y1="186" x2="620" y2="742" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1598EA"/>
      <stop offset="38%" stop-color="#0C73C2"/>
      <stop offset="100%" stop-color="#003E88"/>
    </linearGradient>
    <linearGradient id="aquaGrad" x1="516" y1="660" x2="904" y2="232" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#25C8C8"/>
      <stop offset="100%" stop-color="#11BAB4"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0A2F5B" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="42%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.62"/>
      <stop offset="58%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <style>
      .icon, .wordmark, .tagline { filter: url(#softShadow); }
      .hand {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: handIn .78s cubic-bezier(.18,1.15,.34,1) .02s forwards;
      }
      .bubble {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: bubbleIn .72s cubic-bezier(.2,1,.3,1) .44s forwards;
      }
      .msg-line {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: left center;
        animation: lineIn .34s ease-out forwards;
      }
      .l1 { animation-delay: .94s; }
      .l2 { animation-delay: 1.06s; }
      .l3 { animation-delay: 1.18s; }

      .dot {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: dotPop .30s cubic-bezier(.2,1.2,.35,1) forwards;
      }
      .d1 { animation-delay: .62s; }
      .d2 { animation-delay: .72s; }
      .d3 { animation-delay: .82s; }
      .d4 { animation-delay: .92s; }
      .d5 { animation-delay: 1.02s; }
      .d6 { animation-delay: 1.12s; }
      .d7 { animation-delay: 1.22s; }
      .d8 { animation-delay: 1.32s; }

      .w {
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: wordIn .55s cubic-bezier(.16,1,.3,1) forwards;
      }
      .w1 { animation-delay: 1.26s; }
      .w2 { animation-delay: 1.34s; }
      .w3 { animation-delay: 1.42s; }
      .w4 { animation-delay: 1.50s; }
      .w5 { animation-delay: 1.58s; }
      .w6 { animation-delay: 1.66s; }
      .tag {
        opacity: 0;
        transform: translateY(14px);
        animation: tagIn .48s ease-out 1.98s forwards;
      }
      .shine {
        opacity: 0;
        animation: shineSweep .82s ease-out 2.08s forwards;
      }

      @keyframes handIn {
        0%   { opacity: 0; transform: translate(-32px,26px) scale(.92) rotate(-8deg); }
        70%  { opacity: 1; transform: translate(4px,-4px) scale(1.02) rotate(1deg); }
        100% { opacity: 1; transform: translate(0,0) scale(1) rotate(0); }
      }
      @keyframes bubbleIn {
        0%   { opacity: 0; transform: translate(34px,10px) scale(.92); }
        72%  { opacity: 1; transform: translate(-3px,-2px) scale(1.02); }
        100% { opacity: 1; transform: translate(0,0) scale(1); }
      }
      @keyframes lineIn {
        0%   { opacity: 0; transform: translateX(18px) scaleX(.55); }
        100% { opacity: 1; transform: translateX(0) scaleX(1); }
      }
      @keyframes dotPop {
        0%   { opacity: 0; transform: scale(.15); }
        68%  { opacity: 1; transform: scale(1.16); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes wordIn {
        0%   { opacity: 0; transform: translateY(28px) scale(.96); }
        72%  { opacity: 1; transform: translateY(-3px) scale(1.01); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes tagIn {
        0%   { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      @keyframes shineSweep {
        0%   { opacity: 0; transform: translateX(-720px) rotate(-10deg); }
        12%  { opacity: .72; }
        100% { opacity: 0; transform: translateX(820px) rotate(-10deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .hand,.bubble,.msg-line,.dot,.w,.tag,.shine {
          animation-duration: 0.001s !important;
          animation-delay: 0s !important;
        }
      }
    </style>
  </defs>

  <!-- <rect width="1254" height="1254" fill="white"/> -->

